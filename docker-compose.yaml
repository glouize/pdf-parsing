version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pdf_parsing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pdf_network

  app:
    build: .
    ports:
      - "8050:8050"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pdf_parsing}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdf_network

  prefect-server:
    image: prefecthq/prefect:2-python3.11
    command: prefect server start
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://127.0.0.1:4200/api
    networks:
      - pdf_network

  prefect-worker:
    image: prefecthq/prefect:2-python3.11
    command: prefect worker start -p default-pool
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      - prefect-server
      - postgres
    networks:
      - pdf_network

volumes:
  postgres_data:

networks:
  pdf_network:
    driver: bridge
