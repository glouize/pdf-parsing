[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-parsing"
version = "0.1.0"
description = "PDF → Plaintext → SQL parsing pipeline with LLM-powered extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0",
    "instructor>=1.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.22",
    "openai>=1.0",
    "anthropic>=0.40",
    "prefect>=3.0",
    "dash>=2.18",
    "dash-bootstrap-components>=1.6",
    "jinja2>=3.1",
    "alembic>=1.13",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.0",
]

[project.scripts]
pdf-parsing = "pdf_parsing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_parsing"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
